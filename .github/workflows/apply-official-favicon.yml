name: Apply official Lil Gwapz favicon

on:
  push:
    branches:
      - chore/official-favicon-v3

permissions:
  contents: write

jobs:
  apply-favicon:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/official-favicon-v3
          fetch-depth: 0

      - name: Reconstruct approved favicon source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lil-gwapz-favicon
          curl -fsSL 'https://dmmcy0pwk6bqi.cloudfront.net/21415f558ea5fa16aae6deb5fdf37aaffd001af0' -o /tmp/lil-gwapz-favicon/part-01
          curl -fsSL 'https://dmmcy0pwk6bqi.cloudfront.net/00591f1d363b7a0ca734e6fc44e1b53ac70f5075' -o /tmp/lil-gwapz-favicon/part-02
          curl -fsSL 'https://dmmcy0pwk6bqi.cloudfront.net/a77d554ed7fb64d5546228452e1b4280b598e0a2' -o /tmp/lil-gwapz-favicon/part-03
          curl -fsSL 'https://dmmcy0pwk6bqi.cloudfront.net/893ded23ccd4d43833aee0214f11290ae4671132' -o /tmp/lil-gwapz-favicon/part-04
          curl -fsSL 'https://dmmcy0pwk6bqi.cloudfront.net/ebc262e39048d531ac710c260f2458018b9f56da' -o /tmp/lil-gwapz-favicon/part-05
          cat /tmp/lil-gwapz-favicon/part-* > /tmp/lil-gwapz-favicon/official.png
          echo '6dff5fdb3340cb8ff27c922532321485e0cb70c5b2fc73a00f4acdd0dce662c7  /tmp/lil-gwapz-favicon/official.png' | sha256sum -c -

      - name: Generate favicon compatibility exports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          import shutil

          source = Path('/tmp/lil-gwapz-favicon/official.png')
          brand = Path('assets/brand')
          brand.mkdir(parents=True, exist_ok=True)
          official = brand / 'lil-gwapz-favicon-official.png'
          shutil.copyfile(source, official)

          image = Image.open(source).convert('RGBA')
          if image.size != (192, 192):
              raise SystemExit(f'Unexpected source dimensions: {image.size}')

          def export_png(size, path):
              image.resize((size, size), Image.Resampling.LANCZOS).save(path, 'PNG', optimize=True)

          export_png(32, 'favicon-32.png')
          export_png(96, 'favicon-96.png')
          export_png(180, 'apple-touch-icon.png')
          image.save('favicon.ico', 'ICO', sizes=[(16, 16), (32, 32), (48, 48)])

          # Remove superseded favicon-only assets. Site wordmarks/logos are intentionally untouched.
          for old in [
              brand / 'lil-gwapz-icon-192.png',
              brand / 'lil-gwapz-icon-512.png',
              brand / 'lil-gwapz-icon-master-v1.png',
              brand / 'lil-gwapz-favicon-v1.png',
              brand / 'lil-gwapz-favicon-v2.png',
              Path('favicon-16.png'),
              Path('favicon-48.png'),
              Path('favicon-192.png'),
              Path('favicon-512.png'),
          ]:
              old.unlink(missing_ok=True)

          manifest_path = Path('site.webmanifest')
          manifest = json.loads(manifest_path.read_text())
          manifest['icons'] = [{
              'src': '/assets/brand/lil-gwapz-favicon-official.png?v=lg-v3',
              'sizes': '192x192',
              'type': 'image/png',
              'purpose': 'any',
          }]
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          for path in [
              Path('index.html'),
              Path('browse.html'),
              Path('404.html'),
              Path('privacy.html'),
              Path('ip-policy.html'),
              Path('terms.html'),
          ]:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('lg-v1', 'lg-v3').replace('lg-v2', 'lg-v3')
              path.write_text(text)
          PY

      - name: Lock official favicon spec
        shell: bash
        run: |
          cat > assets/brand/ICON_LOCK.md <<'EOF'
          # Lil Gwapz favicon — OFFICIAL / LOCKED

          Approved by Tha Emerald General on October 13, 2026.

          This crowned **LG** mark is the single official Lil Gwapz favicon. It supersedes all earlier favicon artwork.

          ## Locked design
          - Crowned LG monogram.
          - Glossy yellow-orange **L** and metallic silver-white **G**.
          - Black dimensional outline with rainbow/neon exterior rim.
          - Transparent outer background.
          - Square 1:1 composition.
          - Preserve the crown, proportions, materials, highlights, color balance, rim treatment and transparent background.
          - Do not regenerate, recolor, redraw, crop, simplify or replace without explicit approval.

          ## Canonical production asset
          - `/assets/brand/lil-gwapz-favicon-official.png` — 192 × 192 transparent PNG.
          - SHA-256: `6dff5fdb3340cb8ff27c922532321485e0cb70c5b2fc73a00f4acdd0dce662c7`
          - Derived directly from the approved transparent artwork for web/favicon delivery.

          ## Compatibility exports
          These are not alternate designs; they are required browser/device exports generated from the one official asset.

          | File | Size / format | Use |
          | --- | --- | --- |
          | `/favicon.ico` | 16, 32, 48 px | Browser fallback |
          | `/favicon-32.png` | 32 × 32 | Standard browser icon |
          | `/favicon-96.png` | 96 × 96 | Hi-DPI browser icon |
          | `/apple-touch-icon.png` | 180 × 180 | Apple touch icon |
          | `/assets/brand/lil-gwapz-favicon-official.png` | 192 × 192 | Manifest / canonical favicon source |

          Cache-busting token: `lg-v3`.
          EOF

      - name: Verify replacement
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/brand/lil-gwapz-favicon-official.png
          test ! -e assets/brand/lil-gwapz-icon-192.png
          grep -q 'lil-gwapz-favicon-official.png?v=lg-v3' site.webmanifest
          if grep -R -n -E 'lg-v1|lg-v2' --include='*.html' --include='site.webmanifest' .; then
            echo 'Old favicon cache token remains.' >&2
            exit 1
          fi

      - name: Commit official favicon
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-official-favicon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: make approved Lil Gwapz mark the official favicon'
          git push origin HEAD:chore/official-favicon-v3
