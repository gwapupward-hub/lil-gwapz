name: Stage 6.1 Console Diagnostic

on:
  push:
    branches:
      - stage61-console-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm install --no-save sharp@0.35.5 playwright@1.64.0 serve@14.2.5

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build deterministic preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-stage-1.2.cjs
          node scripts/build-browse.mjs
          node scripts/build-preview.cjs

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          npx serve dist -l 4173 > /tmp/lilgwapz-serve.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/lilgwapz-serve.log
          exit 1

      - name: Capture minimal sticker initiator trace
        run: node scripts/diagnose-stage-6.1-console-min.mjs
